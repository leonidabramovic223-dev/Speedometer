<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Инерциальный Спидометр</title>
    <style>
        :root { --bg: #0e1418; --panel: #162026; --fg: #e8eef1; --muted: #8fa0aa; --line: #2a3943; --accent: #42d0db; --needle: #ff5a4d; --warn: #f0b24a; }
        body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; padding: 16px; margin: 0; display: flex; justify-content: center; }
        .wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
        header { display: flex; align-items: center; justify-content: space-between; }
        h1 { font-size: 1.3rem; text-transform: uppercase; margin: 0; }
        .badge { font-size: .75rem; border: 1px solid var(--line); padding: 3px 9px; border-radius: 99px; color: var(--muted); }
        .gauge { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 8px; }
        svg { display: block; width: 100%; height: auto; }
        .track { fill: none; stroke: var(--line); stroke-width: 10; stroke-linecap: round; }
        .fill { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; }
        .tick { stroke: var(--muted); stroke-width: 1.5; }
        .tick.major { stroke: var(--fg); stroke-width: 2.5; }
        .lbl { fill: var(--muted); font-size: 16px; text-anchor: middle; }
        .needle { stroke: var(--needle); stroke-width: 3; stroke-linecap: round; }
        .hub { fill: var(--panel); stroke: var(--needle); stroke-width: 3; }
        .digits { font-size: 60px; fill: var(--fg); text-anchor: middle; font-weight: 600; }
        .unit { font-size: 12px; fill: var(--muted); text-anchor: middle; }
        .row { display: flex; gap: 8px; }
        button { flex: 1; font: inherit; font-weight: 600; cursor: pointer; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
        button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
        #msg { font-size: .9rem; color: var(--muted); text-align: center; min-height: 1.2em; }
    </style>
</head>
<body>
<div class="wrap">
    <header><h1>Трекер</h1><span id="badge" class="badge">Выкл.</span></header>
    <div class="gauge"><svg id="svg" viewBox="0 0 300 268"></svg></div>
    <div class="row">
        <button id="start" class="primary">Старт</button>
        <button id="calibrate">Установить 0°</button>
    </div>
    <p id="msg">Нажмите «Старт» и разрешите доступ к датчикам.</p>
</div>

<script>
(function() {
    var MAX = 120, CX = 150, CY = 150, RAD = 110, A0 = 135, SWEEP = 270;
    var D = Math.PI / 180;
    var svg = document.getElementById("svg");

    // Отрисовка шкалы
    function pt(deg, r) { var a = deg * D; return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; }
    function el(name, attrs, text) {
        var n = document.createElementNS("http://www.w3.org/2000/svg", name);
        for (var k in attrs) n.setAttribute(k, attrs[k]);
        if (text != null) n.textContent = text;
        svg.appendChild(n); return n;
    }

    var s = pt(A0, RAD), e = pt(A0 + SWEEP, RAD);
    var d = "M " + s[0] + " " + s[1] + " A " + RAD + " " + RAD + " 0 1 1 " + e[0] + " " + e[1];
    el("path", { d: d, "class": "track" });
    var fill = el("path", { d: d, "class": "fill", pathLength: "100", "stroke-dasharray": "0 100" });

    for (var v = 0; v <= MAX; v += 10) {
        var ang = A0 + SWEEP * v / MAX, major = v % 20 === 0;
        var p1 = pt(ang, RAD - 10), p2 = pt(ang, RAD - (major ? 25 : 18));
        el("line", { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], "class": "tick" + (major ? " major" : "") });
        if (major) { var pl = pt(ang, RAD - 42); el("text", { x: pl[0], y: pl[1], "class": "lbl" }, String(v)); }
    }

    var needle = el("line", { x1: CX, y1: CY, x2: CX, y2: CY - (RAD - 20), "class": "needle" });
    el("circle", { cx: CX, cy: CY, r: 8, "class": "hub" });
    var digits = el("text", { x: CX, y: 220, "class": "digits" }, "0");
    el("text", { x: CX, y: 242, "class": "unit" }, "км/ч");

    // --- Состояние ---
    var $ = function(id) { return document.getElementById(id); };
    var badge = $("badge"), msg = $("msg");
    
    var Rm = null;          // Текущая матрица поворота
    var Fx = 0, Fy = 0;     // Вектор "Вперед" машины (зафиксированный при 0°)
    
    var ve = 0, vn = 0;     // Скорость в Земле (Восток, Север)
    var speed = 0, shown = 0, gyroMag = 0;
    var fe = 0, fn = 0;     
    var lastA = 0;
    var mode = "off";       
    var sensors = [];

    function say(text) { msg.textContent = text; }

    // --- Ориентация ---
    function setR(m) {
        Rm = m;
        if (badge.textContent !== "Работает") {
            badge.textContent = "Работает"; badge.style.color = "var(--accent)"; badge.style.borderColor = "var(--accent)";
        }
    }

    function setQuat(q) {
        if (!q) return;
        var x = q[0], y = q[1], z = q[2], w = q[3];
        var xx = x*x, yy = y*y, zz = z*z, xy = x*y, xz = x*z, yz = y*z, xw = x*w, yw = y*w, zw = z*w;
        setR([
            [1 - 2*(yy + zz), 2*(xy - zw), 2*(xz + yw)],
            [2*(xy + zw), 1 - 2*(xx + zz), 2*(yz - xw)],
            [2*(xz - yw), 2*(yz + xw), 1 - 2*(xx + yy)]
        ]);
    }

    function setEuler(aDeg, bDeg, gDeg) {
        var a = aDeg * D, b = bDeg * D, g = gDeg * D;
        var cA = Math.cos(a), sA = Math.sin(a), cB = Math.cos(b), sB = Math.sin(b), cG = Math.cos(g), sG = Math.sin(g);
        setR([
            [cA*cG - sA*sB*sG, -cB*sA, cG*sA*sB + cA*sG],
            [cG*sA + cA*sB*sG, cA*cB, sA*sG - cA*cG*sB],
            [-cB*sG, sB, cB*cG]
        ]);
    }

    function onGyro(x, y, z) {
        gyroMag = Math.sqrt(x*x + y*y + z*z);
    }

    // --- ЯДРО: Интеграция в мировых координатах ---
    function onLinear(ax, ay, az, t) {
        if (!Rm) return; 
        
        var dt = lastA ? Math.min((t - lastA) / 1000, 0.1) : 0;
        lastA = t;
        if (!dt) return;

        // 1. Переводим сырое ускорение в Землю (Восток / Север)
        // Нам не надо ничего "выпрямлять" тут. Мы просто смотрим, куда ускоряется телефон в мире.
        var aEast  = Rm[0][0] * ax + Rm[0][1] * ay + Rm[0][2] * az; 
        var aNorth = Rm[1][0] * ax + Rm[1][1] * ay + Rm[1][2] * az; 
        // Ось Z (гравитация) здесь просто не участвует.

        // 2. Сглаживаем (убираем вибрации)
        var k = 1 - Math.exp(-dt / 0.1);
        fe += (aEast - fe) * k;
        fn += (aNorth - fn) * k;
        
        var planarAcc = Math.sqrt(fe*fe + fn*fn);

        // 3. Интегрируем (только если не крутим телефон в руках)
        var isSpinning = gyroMag > 1.2;
        if (planarAcc > 0.15 && !isSpinning) {
            var gain = (planarAcc - 0.15) / planarAcc;
            ve += fe * gain * dt; 
            vn += fn * gain * dt; 
        }

        // 4. Утечка (сопротивление)
        var decay = Math.pow(0.99, dt * 60); 
        ve *= decay;
        vn *= decay;
    }

    // --- КАЛИБРОВКА (Фиксируем вектор Вперед) ---
    function calibrateZero() {
        if (!Rm) { say("Датчики не готовы.", true); return; }
        
        // Запоминаем, куда смотрит ось Y телефона (условно "вперед") в мировых координатах.
        // Rm[1] — это вторая строка матрицы, то есть вектор оси Y.
        Fx = Rm[1][0]; // Компонента на Восток
        Fy = Rm[1][1]; // Компонента на Север
        
        ve = 0; vn = 0; fe = 0; fn = 0;
        say("0° зафиксирован! Теперь наклоны не влияют на спидометр.");
    }

    // --- УПРАВЛЕНИЕ ---
    async function start() {
        if (mode === "run") {
            mode = "off"; badge.textContent = "Выкл."; badge.style.color = "var(--muted)"; badge.style.borderColor = "var(--line)";
            $("start").textContent = "Старт";
            for (var i = 0; i < sensors.length; i++) { try { sensors[i].stop(); } catch(e){} }
            sensors = [];
            window.removeEventListener("deviceorientation", onOrientEv, true);
            window.removeEventListener("devicemotion", onMotion, true);
            say("Остановлено."); return;
        }
        
        mode = "run"; $("start").textContent = "Стоп";
        say("Запрашиваю доступ...");
        Rm = null; Fx = 0; Fy = 0; ve = 0; vn = 0;

        try {
            if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
                await DeviceMotionEvent.requestPermission();
            }
            if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
                await DeviceOrientationEvent.requestPermission();
            }
            
            if ("AbsoluteOrientationSensor" in window) {
                var orient = new AbsoluteOrientationSensor({ frequency: 50 });
                orient.addEventListener("reading", function() { setQuat(orient.quaternion); });
                orient.start(); sensors.push(orient);
            } else {
                window.addEventListener("deviceorientationabsolute", onOrientEv, true);
                window.addEventListener("deviceorientation", onOrientEv, true);
            }

            if ("LinearAccelerationSensor" in window) {
                var acc = new LinearAccelerationSensor({ frequency: 50 });
                acc.addEventListener("reading", function() { onLinear(acc.x, acc.y, acc.z, performance.now()); });
                acc.start(); sensors.push(acc);
            } else {
                window.addEventListener("devicemotion", onMotion, true);
            }

            if ("Gyroscope" in window) {
                var gyro = new Gyroscope({ frequency: 50 });
                gyro.addEventListener("reading", function() { onGyro(gyro.x, gyro.y, gyro.z); });
                gyro.start(); sensors.push(gyro);
            }
            say("Датчики активны. Нажмите «Установить 0°».");
        } catch(e) { say("Ошибка доступа к датчикам."); }
    }

    function onOrientEv(ev) { if (ev.alpha != null) setEuler(ev.alpha, ev.beta, ev.gamma); }
    function onMotion(ev) {
        if (ev.rotationRate && ev.rotationRate.alpha != null) onGyro(ev.rotationRate.alpha, ev.rotationRate.beta, ev.rotationRate.gamma);
        if (ev.acceleration && ev.acceleration.x != null) onLinear(ev.acceleration.x, ev.acceleration.y, ev.acceleration.z, performance.now());
    }

    // --- Отрисовка и ПРОЕКЦИЯ ВЫХОДНЫХ ДАННЫХ ---
    var prev = performance.now();
    function frame(now) {
        var dt = Math.min((now - prev) / 1000, 0.1); prev = now;

        // Вот тут происходит магия:
        // Мы берем мировую скорость (ve, vn) и проецируем её на зафиксированный вектор ВПЕРЕД (Fx, Fy).
        // Это скалярное произведение. Оно дает нам скорость строго вдоль оси машины.
        var vForward = (ve * Fx) + (vn * Fy);
        speed = Math.abs(vForward);

        var kmh = mode === "off" ? 0 : speed * 3.6;
        shown += (kmh - shown) * Math.min(1, dt * 10);
        var c = Math.max(0, Math.min(MAX, shown));
        
        needle.setAttribute("transform", "rotate(" + (A0 + SWEEP * c / MAX + 90) + " " + CX + " " + CY + ")");
        fill.setAttribute("stroke-dasharray", (c / MAX * 100) + " 100");
        digits.textContent = String(Math.round(shown));
        
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    $("start").addEventListener("click", start);
    $("calibrate").addEventListener("click", calibrateZero);

})();
</script>
</body>
</html>
